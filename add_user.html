{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6">
<a href="{% url "manage_users" %}" class="btn-ghost mb-3">← Back</a>
<div class="form-card">
<h5 class="fw-bold mb-4" style="color:#0a5c36">👤 Naya User Add Karo</h5>
<form method="post">{% csrf_token %}
{% for field in form %}
<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
{% if field.errors %}<div class="text-danger" style="font-size:.78rem">{{ field.errors.0 }}</div>{% endif %}
</div>{% endfor %}
<button type="submit" class="btn-emerald w-100" style="padding:12px">User Save Karo</button>
</form>
</div>
</div>
</div>
{% endblock %}
