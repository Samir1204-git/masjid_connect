{% extends "base.html" %}
{% block title %}Para / Juz Index{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
<a href="{% url "quran_home" %}" style="color:#64748b;text-decoration:none;font-size:1.2rem">←</a>
<h4 class="fw-bold mb-0" style="color:#0a5c36">📚 Para / Juz Index</h4>
</div>
<div class="row g-3">
{% for para in paras %}
<div class="col-6 col-md-4 col-lg-3">
<a href="{% url "quran_reader_page" para.page %}" style="text-decoration:none;display:block;padding:16px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;transition:all .2s;text-align:center" onmouseover="this.style.borderColor='#0a5c36'" onmouseout="this.style.borderColor='#e2e8f0'">
<div style="font-size:1.5rem;font-weight:800;color:#0a5c36;margin-bottom:4px">{{ para.number }}</div>
<div style="font-size:.8rem;font-weight:600;color:#1e293b">Para {{ para.number }}</div>
<div style="font-size:.7rem;color:#64748b;margin-top:2px">{{ para.label }}</div>
<div style="font-size:.68rem;color:#94a3b8;margin-top:4px">Page {{ para.page }}</div>
</a>
</div>
{% endfor %}
</div>
{% endblock %}
